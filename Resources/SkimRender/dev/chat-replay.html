<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Tab Replay</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../skim.css">
<link rel="stylesheet" href="../chat.css">
</head><body>
<script src="../vendor/marked.min.js"></script>
<script src="../vendor/purify.min.js"></script>
<script src="../vendor/highlight.min.js"></script>
<script src="../vendor/hljs-dart.min.js"></script>
<script src="../skim-classify.js"></script>
<script src="../skim-render.js"></script>
<script src="../agent-events.js"></script>
<script src="../agent-claude.js"></script>
<script src="../agent-codex.js"></script>
<script src="../chat.js"></script>
<script src="session-sample.js"></script>
<script src="dock-sample.js"></script>
<script src="change-sample.js"></script>
<script src="history-sample.js"></script>
<script src="dialog-sample.js"></script>
<script>
  // Replays a recorded sidecar session into the Claude tab page.
  //   ?stop=permission   stop right after the first approval request (pending card)
  //   ?speed=4           timed replay at 4× (default: instant)
  //   ?pop=model|mode|usage|more|slash|slash-arg   open a dock menu (instant replay only)
  //   ?change=edit|write|multi (&diff=1, &big=1)  an approval card with a file change
  //   ?side=1 (&back=1)  a side chat with one exchange (or main in view, with the side's news)
  //   ?think=live|done|open  a thinking block with summary text
  //   ?resume=pick|done  the /resume list, or a resumed conversation
  //   ?ref=select|chips  a selected reply passage, or two referenced ones in the composer
  //   ?ask=1 (a pending AskUserQuestion) · ?plan=1 (a pending plan card) · ?tasks=1 (a task list, opened)
  //   ?mention=1 ('@chat' typed, with the files answer) · ?images=1 (two image chips, one sent image)
  //   ?notices=1 (retry, rate-limit warning, hook error, permission denied)
  //   ?voice=1 (the mic listening, with words in the composer) · ?pop=more also shows a session name
  //   ?btw=1 (a side question answered, a follow-up waiting) · ?rewind=1 (the rewind panel for a sent prompt, after its files answer) · ?tray=1 (the first turn's tool tray open) · ?long=1 (the prompt is long: folded) · ?subagent=1 (the panel)
  const q = new URLSearchParams(location.search);
  const events = window.SESSION_SAMPLE;
  const init = events.find(e => e.type === 'sdk' && e.msg.subtype === 'init');
  // ?rewind=1 needs the files request's id: a stub host that keeps it.
  if (q.get('rewind') || q.get('btw')) window.webkit = { messageHandlers: { skim: { postMessage: m => {
    if (m.action && m.action.type === 'rewindFiles') window.__lastRewindId = m.action.id;
    if (m.action && m.action.type === 'btw') window.__lastBtwId = m.action.id;
    return Promise.resolve(); } } } };
  ClaudeChat.boot({ cwd: init ? init.msg.cwd : '', home: '/Users/demo', voice: true });
  ClaudeChat.showUser(q.get('long') ? Array.from({ length: 18 }, (_, i) => `${i + 1}) Step ${i + 1} of a long pasted task list: read, check and report.`).join('\n')
    : 'Do these in order: 1) Read README.md. 2) Run ls -la. 3) Write notes.txt. Then summarize with a table and a "Things to know" list.');
  const stopAt = q.get('stop') === 'permission' ? events.findIndex(e => e.type === 'permission_request') : events.length - 1;
  const speed = Number(q.get('speed') || 0);
  if (!speed) {
    ClaudeChat.receive(events.slice(0, stopAt + 1));
    // Reset times relative to now, so the sample does not go stale.
    for (const e of window.DOCK_SAMPLE || []) if (e.plan) e.plan.limits.forEach((l, i) => { l.resets_at = new Date(Date.now() + [2.4 * 3600e3, 5.2 * 86400e3][i % 2]).toISOString(); });
    ClaudeChat.receive(window.DOCK_SAMPLE || []);
    const pop = q.get('pop');
    const inp = document.querySelector('.ck-input');
    const type = v => { inp.focus(); inp.value = v; inp.setSelectionRange(v.length, v.length); inp.dispatchEvent(new Event('input')); };
    if (pop === 'model') document.querySelector('.ck-model').click();
    if (pop === 'mode') document.querySelector('.ck-mode').click();
    if (pop === 'usage') document.querySelector('.ck-usage').click();
    if (pop === 'more') { ClaudeChat.receive([{ type: 'title', title: 'Fix the parser crash', custom: true }]); document.querySelector('.ck-more').click(); }
    if (q.get('subagent')) {
      const sm = (uuid, content) => ({ type: 'sdk', msg: { type: 'assistant', uuid, parent_tool_use_id: 'tu-ag', message: { id: 'sm-' + uuid, content } } });
      const sr = (id, content) => ({ type: 'sdk', msg: { type: 'user', parent_tool_use_id: 'tu-ag', message: { role: 'user', content: [{ type: 'tool_result', tool_use_id: id, content }] } } });
      ClaudeChat.showUser('Where is the retry notice built?');
      ClaudeChat.receive([{ type: 'sdk', msg: { type: 'stream_event', event: { type: 'message_start', message: { id: 'm-ag' } } } },
        { type: 'sdk', msg: { type: 'assistant', parent_tool_use_id: null, message: { id: 'm-ag', content: [{ type: 'tool_use', id: 'tu-ag', name: 'Agent',
          input: { description: 'Find the retry notice code', prompt: 'Find where the page builds the retry notice. Report the file and function.', subagent_type: 'Explore' } }] } } },
        sm('a1', [{ type: 'thinking', thinking: 'The notice text says “Retrying in”; search for it.' }]),
        sm('a2', [{ type: 'text', text: 'I will search the page code for the notice text.' }]),
        sm('a3', [{ type: 'tool_use', id: 'tu-g', name: 'Grep', input: { pattern: 'Retrying in', path: 'Resources/SkimRender' } }]),
        sr('tu-g', 'Resources/SkimRender/chat.js:2380'),
        sm('a4', [{ type: 'tool_use', id: 'tu-r', name: 'Read', input: { file_path: init.msg.cwd + '/Resources/SkimRender/chat.js', offset: 2360, limit: 40 } }]),
        sr('tu-r', 'function onRetry(e) {\n  …\n}'),
        sm('a5', [{ type: 'text', text: 'Found it: **`onRetry`** in `chat.js` builds the notice, and `settleRetry` fades it when the next event arrives.' }]),
        { type: 'system', subtype: 'x' } ].filter(e => e.type === 'sdk'));
      document.querySelector('.ck-row.is-agent').click();
    }
    if (q.get('rewind')) {
      ClaudeChat.receive([{ type: 'sdk', msg: { type: 'assistant', uuid: 'e-1', parent_tool_use_id: null, message: { id: 'm-e1', content: [{ type: 'text', text: 'Noted.' }] } } }]);
      type('Rename the retry helper to backoff() and update its callers'); inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      ClaudeChat.receive([{ type: 'sdk', msg: { type: 'assistant', uuid: 'e-2', parent_tool_use_id: null, message: { id: 'm-e2', content: [{ type: 'text', text: 'Renamed it in three files.' }] } } },
        { type: 'sdk', msg: { type: 'result', subtype: 'success', duration_ms: 4200, num_turns: 3, total_cost_usd: 0.02 } }]);
      [...document.querySelectorAll('.ck-turn[data-rewind] .ck-rewind-btn')].pop().click();
      // (the folder in view: the dock sample's session, which came last)
      const cwd = ((window.DOCK_SAMPLE || []).find(e => e.msg && e.msg.subtype === 'init') || init).msg.cwd;
      ClaudeChat.receive([{ type: 'rewind', id: window.__lastRewindId, uuid: 'x', dryRun: true, canRewind: true,
        filesChanged: [cwd + '/Resources/ClaudeSidecar/sidecar.mjs', cwd + '/Resources/SkimRender/chat.js', cwd + '/README.md'], insertions: 14, deletions: 9 }]);
    }
    if (q.get('btw')) {
      type('/btw why did the hook block the write?'); inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      ClaudeChat.receive([{ type: 'btw', id: window.__lastBtwId, response: 'The project has a **PreToolUse** hook on `Write` that refuses new files in this probe folder. It is in `.claude/settings.json`; remove it, or ask me to write somewhere else.' }]);
      const f = document.querySelector('.ck-btw-field'); f.value = 'where is that file?';
      f.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    }
    if (q.get('tray')) setTimeout(() => { window.__keepScroll = true; window.scrollTo(0, 0); document.querySelector('.ck-tray-pill').click(); }, 100);
    if (q.get('voice')) {
      type('Now look at ');
      document.querySelector('.ck-mic').click();
      ClaudeChat.voice({ state: 'listening' });
      ClaudeChat.voice({ state: 'listening', text: 'the retry logic in the sidecar', final: false });
    }
    if (pop === 'slash') type(q.get('q') != null ? '/' + q.get('q') : '/');
    if (pop === 'slash-arg') type(q.get('q') || '/code-review ');
    // ?change=edit|write|multi: an approval card for that file change (&big=1 expands it, &diff=1 shows Diff)
    const change = q.get('change');
    if (change) {
      const toolName = { edit: 'Edit', write: 'Write', multi: 'MultiEdit' }[change];
      ClaudeChat.showUser('Raise the TTL and cap the cache size');
      ClaudeChat.receive([{ type: 'permission_request', id: 'p-demo', toolName, input: CHANGE_SAMPLE[change], toolUseID: 'tu-demo', suggestions: [] }]);
      setTimeout(() => {
        if (q.get('diff')) document.querySelector('.ck-card:last-of-type .ck-seg-b[data-m="diff"]').click();
        if (q.get('big')) document.querySelector('.ck-card:last-of-type .ck-chg-exp').click();
        window.__keepScroll = true;
        document.querySelector('.ck-card:last-of-type').scrollIntoView({ block: q.get('big') ? 'start' : 'center' });
      }, 150);
    }
    // ?side=1: a side chat with one exchange (&back=1: main in view, with the side's news on the switch)
    if (q.get('side')) {
      document.querySelector('.ck-view').click();
      type('Which step failed, and would a retry help?');
      inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
      ClaudeChat.receive([
        { type: 'sdk', msg: { type: 'system', subtype: 'init', session_id: 'side-demo', model: 'claude-opus-5-5[1m]', permissionMode: 'default', cwd: init.msg.cwd } },
        { type: 'sdk', msg: { type: 'assistant', parent_tool_use_id: null, message: { id: 'side-a1', model: 'claude-opus-5-5', content: [{ type: 'text', text:
          'Step 3 failed: the **Write** of `notes.txt` was blocked by a hook.\n\n**Things to know:**\n- A retry would fail the same way — the hook refuses every write in this folder.\n- To write the file, remove or relax the hook in `.claude/settings.json` first.' }] } } },
        { type: 'sdk', msg: { type: 'result', subtype: 'success', duration_ms: 4200, num_turns: 1, total_cost_usd: 0.02 } }], 'side-1');
      if (q.get('back')) document.querySelector('.ck-view').click();
    }
    // ?think=live|done|open: a thinking block with summary text (still thinking, finished, or finished and opened)
    const think = q.get('think');
    if (think) {
      ClaudeChat.showUser('Is 391 prime? Check it properly.');
      const t = Date.now() - 14000, ev = (dt, event) => ({ t: t + dt, type: 'sdk', msg: { type: 'stream_event', parent_tool_use_id: null, event } });
      const parts = ['**Checking small primes**\n\n391 is odd, and its digits sum to 13, so 2 and 3 are out. It does not end in 0 or 5.\n\n',
        '**Trying 7 to 19**\n\n7 × 55 = 385, remainder 6. 11 × 35 = 385, remainder 6. 13 × 30 = 390, remainder 1. ',
        '17 × 23 = 391 — found a factor.\n\n**Conclusion**\n\n391 = 17 × 23, so it is not prime.'];
      const evs = [ev(0, { type: 'message_start', message: { id: 'th-demo', model: 'claude-opus-5-5' } }),
        ev(10, { type: 'content_block_start', index: 0, content_block: { type: 'thinking', thinking: '' } }),
        ...parts.map((p, i) => ev(3000 * (i + 1), { type: 'content_block_delta', index: 0, delta: { type: 'thinking_delta', thinking: p } }))];
      if (think !== 'live') evs.push(ev(12000, { type: 'content_block_stop', index: 0 }),
        ev(12100, { type: 'content_block_start', index: 1, content_block: { type: 'text', text: '' } }),
        ev(12200, { type: 'content_block_delta', index: 1, delta: { type: 'text_delta', text: 'No — **391 = 17 × 23**.' } }),
        ev(12300, { type: 'content_block_stop', index: 1 }));
      ClaudeChat.receive(think === 'live' ? evs.slice(0, 4) : evs);
      if (think === 'open') document.querySelector('.ck-turn:last-of-type .ck-think-head').click();
    }
    // ?resume=pick|done: the /resume list, or a resumed conversation drawn from its history
    const resume = q.get('resume');
    if (resume) {
      const H = { ...window.HISTORY_SAMPLE, sessionId: 'b7c1e2d4-0000-4000-8000-00000000demo' };
      const now = Date.now();
      type('/resume ');
      ClaudeChat.receive([{ type: 'sessions', list: [
        { id: init.msg.session_id, title: 'Probe project walk-through', firstPrompt: 'Do these in order', branch: null, modified: now - 40e3, size: 9e4 },
        { id: H.sessionId, title: 'Cache TTL and eviction', firstPrompt: 'Raise the TTL and cap the cache size', branch: 'feature/cache', modified: now - 3 * 3600e3, size: 2.4e6 },
        { id: 'c0ffee00-0000-4000-8000-000000000002', title: 'Fix the flaky Space test', firstPrompt: 'why does the window drop out of its Space', branch: 'fix/spaces', modified: now - 2 * 86400e3, size: 6.1e6 },
        { id: 'c0ffee00-0000-4000-8000-000000000003', title: 'Network recording export', firstPrompt: 'add HAR export', branch: 'feature/net', modified: now - 17 * 86400e3, size: 1.2e6 }] }]);
      if (resume === 'done') {
        inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true, cancelable: true }));
        inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        ClaudeChat.receive([H]);
      }
    }
    // ?ask=1: two questions (one of them several-choice, one option with a preview)
    if (q.get('ask')) {
      ClaudeChat.showUser('Add a cache for the feed');
      ClaudeChat.receive([...toolLines('tu-ask', 'AskUserQuestion', ASK_INPUT),
        { type: 'permission_request', id: 'p-ask', toolName: 'AskUserQuestion', input: ASK_INPUT, toolUseID: 'tu-ask', suggestions: [] }]);
      if (q.get('pick')) setTimeout(() => {
        const first = document.querySelector('.ck-ask .ck-q .ck-q-opt'); first.click(); first.dispatchEvent(new Event('mouseenter'));
      }, 100);
      setTimeout(() => { window.__keepScroll = true; document.querySelector('.ck-card:last-of-type').scrollIntoView({ block: 'start' }); }, 250);
    }
    // ?plan=1: the plan card (&big=1 expands the plan)
    if (q.get('plan')) {
      ClaudeChat.showUser('Plan a cache for the feed');
      ClaudeChat.receive([...toolLines('tu-plan', 'ExitPlanMode', PLAN_INPUT),
        { type: 'permission_request', id: 'p-plan', toolName: 'ExitPlanMode', input: PLAN_INPUT, toolUseID: 'tu-plan', suggestions: [] }]);
      setTimeout(() => {
        if (q.get('big')) document.querySelector('.ck-plan-wrap .ck-chg-exp').click();
        window.__keepScroll = true; document.querySelector('.ck-card:last-of-type').scrollIntoView({ block: 'start' });
      }, 250);
    }
    // ?tasks=1: five tasks, two done, one in progress; the list open (&folded=1: folded)
    if (q.get('tasks')) {
      ClaudeChat.showUser('Add a cache for the feed');
      const todos = [['Read the feed code', 'Reading the feed code', 'completed'], ['Write src/cache.js', 'Writing src/cache.js', 'completed'],
        ['Wrap fetchFeed in the cache', 'Wrapping fetchFeed in the cache', 'in_progress'], ['Read the TTL from the config', 'Reading the TTL from the config', 'pending'],
        ['Add tests for get, set and expiry', 'Adding tests', 'pending']].map(([content, activeForm, status]) => ({ content, activeForm, status }));
      ClaudeChat.receive(toolLines('tu-todo', 'TodoWrite', { todos }, 'Todos have been modified successfully'));
      if (!q.get('folded')) document.querySelector('.ck-tasks-head').click();
    }
    // ?mention=1: '@chat' typed, with the host's files answer (and two subagents)
    if (q.get('mention')) {
      ClaudeChat.receive([{ ...window.DOCK_SAMPLE[0], agents: [{ name: 'chat-reviewer', description: 'Reviews changes to the chat page' }, { name: 'explorer', description: 'Searches the codebase' }],
        features: { mentions: true, images: true } }]);
      type('Look at @chat');
      setTimeout(() => ClaudeChat.receive([{ type: 'files', id: 1, query: 'chat', suggestions: [{ path: 'Resources/SkimRender/chat.js' }, { path: 'Resources/SkimRender/chat.css' },
        { path: 'Resources/SkimRender/dev/chat-replay.html' }, { path: 'Sources/FloatyTerm/ClaudeChatController.swift' }, { path: 'Resources/ClaudeSidecar/' }] }]), 250);
    }
    // ?images=1: an image sent in a turn, two more as chips in the composer
    if (q.get('images')) {
      const drop = (label, hue, w, h) => ClaudeChat.dropFiles([{ path: '/tmp/' + label + '.png', rel: label + '.png', isDir: false, image: { mediaType: 'image/png', data: samplePng(w, h, label, hue), name: label + '.png' } }]);
      drop('layout', 20, 1280, 720);
      setTimeout(() => {
        type('What is wrong with this layout?');
        inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        drop('before', 200, 1280, 720); drop('after', 120, 800, 600);
      }, 200);
    }
    // ?notices=1: a retry, a rate-limit warning, a hook that blocked, a permission denial
    if (q.get('notices')) {
      ClaudeChat.showUser('Write notes.txt and run the tests');
      const sdk = msg => ({ type: 'sdk', msg });
      ClaudeChat.receive([sdk({ type: 'system', subtype: 'api_retry', attempt: 2, max_retries: 10, retry_delay_ms: 5000, error_status: 529 }),
        sdk({ type: 'rate_limit_event', rate_limit_info: { status: 'allowed_warning', resetsAt: Math.floor(Date.now() / 1000) + 2 * 3600, rateLimitType: 'five_hour', utilization: 0.85 } }),
        sdk({ type: 'system', subtype: 'hook_response', hook_name: 'PreToolUse:Bash', hook_event: 'PreToolUse', stderr: 'Blocked: rm -rf is not allowed in this project', exit_code: 2, outcome: 'error' }),
        sdk({ type: 'system', subtype: 'permission_denied', tool_name: 'Bash', message: 'curl to an unlisted host' })]);
    }
    // ?up=1: read higher up while new output arrives (the down button shows, with its dot)
    if (q.get('up')) {
      window.__keepScroll = true;
      setTimeout(() => {
        window.scrollTo(0, document.documentElement.scrollHeight - innerHeight - 260);
        window.dispatchEvent(new Event('scroll'));
        ClaudeChat.receive([{ type: 'host', kind: 'info', message: 'New output while you read.' }]);
        type('A draft I am still writing');
      }, 300);
    }
    // ?ref=select: a reply passage selected (the button shows) · ?ref=chips: two passages referenced
    const ref = q.get('ref');
    if (ref) {
      const items = [...document.querySelectorAll('.ck-text li')].slice(-3);
      const pick = el => { const r = document.createRange(); r.selectNodeContents(el); getSelection().removeAllRanges(); getSelection().addRange(r); document.dispatchEvent(new MouseEvent('mouseup')); };
      if (ref === 'chips') { pick(items[0]); setTimeout(() => { document.querySelector('.ck-refbtn').click(); pick(items[2]); setTimeout(() => { document.querySelector('.ck-refbtn').click(); type('Why did the hook refuse it?'); }, 50); }, 50); }
      else pick(items[2]);
    }
  }
  else {
    let i = 0;
    const next = () => {
      if (i > stopAt) return;
      const e = events[i++];
      ClaudeChat.receive([e]);
      const gap = i <= stopAt ? (events[i].t - e.t) / speed : 0;
      setTimeout(next, Math.min(gap, 1500));
    };
    next();
  }
</script>
</body></html>
