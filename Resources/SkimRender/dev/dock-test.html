<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Dock Test</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../skim.css">
<link rel="stylesheet" href="../chat.css">
</head><body>
<script src="../vendor/marked.min.js"></script>
<script src="../vendor/purify.min.js"></script>
<script src="../vendor/highlight.min.js"></script>
<script src="../skim-classify.js"></script>
<script src="../skim-render.js"></script>
<script src="../agent-events.js"></script>
<script src="../agent-claude.js"></script>
<script src="../agent-codex.js"></script>
<script src="../chat.js"></script>
<script src="dock-sample.js"></script>
<script src="change-sample.js"></script>
<script src="history-sample.js"></script>
<script src="dialog-sample.js"></script>
<script>
  // Scripted checks of the dock: slash suggestions, argument choices, menus, keys.
  //   swift Resources/SkimRender/dev/snapshot.swift Resources/SkimRender/dev/dock-test.html /tmp/dock.png 700 1 420
  // Failures print as JS errors; the last line says how many checks passed.
  window.__pending = true;
  // Motion off for the checks that measure sizes; section 31 turns it on to check the motion itself.
  document.documentElement.classList.add('no-motion');
  const posts = [];
  window.webkit = { messageHandlers: { skim: { postMessage: m => { if (m.type === 'action') posts.push(m.action); return Promise.resolve(); } } } };
  ClaudeChat.boot({ cwd: '/tmp/demo', home: '' });
  ClaudeChat.receive([{ type: 'sdk', msg: { type: 'system', subtype: 'init', model: 'claude-opus-5-5[1m]', permissionMode: 'default', session_id: 's1', cwd: '/tmp/demo', terminal_slash_commands: ['color'] } }]);
  // Menu data only: this page brings its own session (init) and git state.
  ClaudeChat.receive(window.DOCK_SAMPLE.filter(e => e.type !== 'git' && !(e.msg && e.msg.subtype === 'init')));

  const $ = s => document.querySelector(s);
  const inp = $('.ck-input');
  const type = v => { inp.focus(); inp.value = v; inp.setSelectionRange(v.length, v.length); inp.dispatchEvent(new Event('input')); };
  const key = (k, o = {}) => (o.target || inp).dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...o }));
  const items = () => [...document.querySelectorAll('.ck-pop-item .ck-pop-title')].map(e => e.textContent.trim());
  const sel = () => { const e = $('.ck-pop-item.is-sel .ck-pop-title'); return e && e.textContent.trim(); };
  const popOpen = () => !$('.ck-pop').hidden;
  const lastPost = t => posts.filter(p => p.type === t).pop();
  let pass = 0;
  const check = (name, ok, got) => { if (ok) pass++; else console.error('FAIL ' + name + (got !== undefined ? ' — got ' + JSON.stringify(got) : '')); };

  // 1 · name suggestions
  type('/con');
  check('slash opens', popOpen() && $('.ck-pop').dataset.kind === 'slash');
  check('closest name first', items()[0].startsWith('/config'), items().slice(0, 3));
  check('terminal-only command hidden', !items().some(t => t.startsWith('/color')));
  type('/cost');
  check('alias finds /usage', items()[0].startsWith('/usage'), items()[0]);
  type('/con');
  key('ArrowDown');
  check('arrow moves selection', sel() && sel().startsWith('/context'), sel());
  key('Tab');
  check('Tab completes', inp.value === '/context ', inp.value);
  check('no hint, no choices: closed', !popOpen());

  // 2 · argument choices
  type('/effort ');
  check('effort choices', items().join(',') === 'low,medium,high,xhigh,max,auto', items());
  type('/effort h');
  check('choices filter by prefix', items().join(',') === 'high', items());
  key('Enter');
  check('Enter picks a choice', inp.value === '/effort high ', inp.value);
  key('Enter');
  check('/effort runs here', lastPost('setEffort') && lastPost('setEffort').effort === 'high', lastPost('setEffort'));
  check('no turn sent for /effort', !lastPost('send'));
  check('chip shows effort', $('.ck-model').textContent.includes('high'), $('.ck-model').textContent);
  type('/code-review --fix ');
  check('used flag not offered again', !items().includes('--fix') && items().includes('low'), items());

  // 3 · Return on a command without arguments sends it
  type('/cont');
  key('Enter');
  check('Enter on /context sends it', lastPost('send') && lastPost('send').text === '/context', lastPost('send'));
  check('composer cleared', inp.value === '');

  // 4 · Escape closes suggestions first
  type('/');
  key('Escape');
  check('Esc closes suggestions', !popOpen());
  check('Esc did not interrupt', !lastPost('interrupt'));

  // 5 · model menu
  $('.ck-model').click();
  check('model menu opens', popOpen() && $('.ck-pop').dataset.kind === 'model');
  check('current model checked', $('.ck-pop-item.is-current .ck-pop-title').textContent.startsWith('Default'));
  key('ArrowRight', { target: document.body });
  check('→ raises effort', lastPost('setEffort').effort === 'xhigh', lastPost('setEffort'));
  const sends = posts.filter(p => p.type === 'send').length;
  inp.focus(); inp.value = 'draft';
  key('ArrowDown'); key('Enter');
  check('Enter in the composer picks from the open menu', lastPost('setModel') && lastPost('setModel').model === 'opus[1m]', lastPost('setModel'));
  check('…and does not send the draft', posts.filter(p => p.type === 'send').length === sends && inp.value === 'draft');
  inp.value = '';
  $('.ck-model').click();
  [...document.querySelectorAll('.ck-pop-item')].find(e => e.textContent.startsWith('Sonnet')).click();
  check('pick posts setModel', lastPost('setModel') && lastPost('setModel').model === 'sonnet', lastPost('setModel'));
  check('chip shows Sonnet', $('.ck-model').textContent.startsWith('Sonnet 5'), $('.ck-model').textContent);
  check('menu closed', !popOpen());

  // 6 · permission modes
  key('Tab', { shiftKey: true });
  check('⇧Tab cycles to Accept edits', lastPost('setPermissionMode').mode === 'acceptEdits', lastPost('setPermissionMode'));
  $('.ck-mode').click();
  check('mode menu lists Auto', items().some(t => t.includes('Auto')), items());
  [...document.querySelectorAll('.ck-pop-item')].find(e => e.textContent.includes('Auto')).click();
  check('pick Auto', lastPost('setPermissionMode').mode === 'auto' && $('.ck-mode').dataset.mode === 'auto');
  ClaudeChat.receive([{ type: 'mode', mode: 'default' }]);
  check('a failed change falls back', $('.ck-mode').dataset.mode === 'default');

  // 7 · usage panel
  $('.ck-usage').click();
  check('usage panel opens', !$('.ck-usage-panel').hidden);
  check('asks for plan limits', lastPost('usage') && lastPost('usage').plan === true, lastPost('usage'));
  check('shows the limits', $('.ck-usage-panel').textContent.includes('74%'));
  key('Escape');
  check('Esc closes the panel', $('.ck-usage-panel').hidden);

  // 8 · references from a reply
  (async () => { try {
    const tick = () => new Promise(r => setTimeout(r, 30));
    ClaudeChat.showUser('Plan the cache change');
    ClaudeChat.receive([
      { type: 'sdk', msg: { type: 'assistant', parent_tool_use_id: null, message: { id: 'm1', model: 'claude-opus-5-5', content: [{ type: 'text', text: 'Use a write-through cache.\n\nKeep the TTL at 5 minutes, because the feed updates hourly.' }] } } },
      { type: 'sdk', msg: { type: 'result', subtype: 'success', duration_ms: 1000, num_turns: 1, total_cost_usd: 0.01 } }]);
    const paras = [...document.querySelectorAll('.ck-turn:last-child .ck-text p')];
    const select = (a, b) => { const r = document.createRange(); r.setStart(a, 0); r.setEnd(b, b.childNodes.length); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.dispatchEvent(new MouseEvent('mouseup')); };
    select(paras[1], paras[1]);
    await tick();
    const btn = $('.ck-refbtn');
    check('button shows on a reply selection', !btn.hidden);
    const b = btn.getBoundingClientRect(), p = paras[1].getBoundingClientRect();
    check('button sits by the selection', Math.abs(b.top - p.bottom) < 60 || Math.abs(b.bottom - p.top) < 60, [b.top, p.bottom]);
    btn.click();
    check('chip in the composer', document.querySelectorAll('.ck-refs .ck-ref').length === 1 && !$('.ck-refs').hidden);
    check('chip is a preview', $('.ck-refs .ck-ref-text').textContent.startsWith('Keep the TTL'));
    check('selection cleared, button hidden', getSelection().isCollapsed && btn.hidden);
    // a selection in the user's own message is not offered
    select($('.ck-turn:last-child .ck-user-text'), $('.ck-turn:last-child .ck-user-text'));
    await tick();
    check('no button on a user message', btn.hidden);
    getSelection().removeAllRanges();
    // two passages, then remove one with the ×, then Backspace removes the other
    select(paras[0], paras[0]); await tick(); btn.click();
    check('second reference', document.querySelectorAll('.ck-refs .ck-ref').length === 2);
    $('.ck-refs .ck-ref-x').click();
    check('× removes it', document.querySelectorAll('.ck-refs .ck-ref').length === 1 && $('.ck-refs .ck-ref-text').textContent.startsWith('Use a write'));
    inp.value = ''; key('Backspace');
    check('⌫ in an empty composer removes the last', $('.ck-refs').hidden);
    // send one with a message
    select(paras[1], paras[1]); await tick(); btn.click();
    type('Make it 10 minutes instead');
    key('Enter');
    const sent = lastPost('send').text;
    check('sent text carries the note', sent.startsWith('The user selected the passage(s) below from your earlier replies in this conversation and referenced them in this message.\n\n<referenced_text'), sent.slice(0, 160));
    check('sent text carries the passage and its origin', sent.includes('<referenced_text from_reply_to="Plan the cache change">\nKeep the TTL at 5 minutes') , sent);
    check('message comes last', sent.endsWith('Make it 10 minutes instead'));
    const u = $('.ck-turn:last-child .ck-user');
    check('turn shows chip + message, not the note', u.querySelector('.ck-ref') && u.textContent.includes('Make it 10') && !u.textContent.includes('The user selected'), u.textContent);
    check('composer chips cleared', $('.ck-refs').hidden);

    // 9 · scrolling: typing never moves the view; the down button does
    ClaudeChat.receive([{ type: 'sdk', msg: { type: 'assistant', parent_tool_use_id: null, message: { id: 'm2', model: 'claude-opus-5-5',
      content: [{ type: 'text', text: Array.from({ length: 40 }, (_, i) => `Paragraph ${i + 1} of a long reply.`).join('\n\n') }] } } }]);
    await tick(); await tick();
    window.scrollTo(0, 0); window.dispatchEvent(new Event('scroll'));
    await tick();
    const down = $('.ck-down');
    check('down button shows away from the bottom', !down.hidden);
    type('I am typing a long draft'); await tick(); await tick();
    check('typing does not scroll', window.scrollY === 0, window.scrollY);
    ClaudeChat.receive([{ type: 'sdk', msg: { type: 'assistant', parent_tool_use_id: null, message: { id: 'm3', model: 'claude-opus-5-5', content: [{ type: 'text', text: 'More output.' }] } } }]);
    await tick(); await tick();
    check('new output does not scroll either', window.scrollY === 0, window.scrollY);
    check('…and dots the down button', down.dataset.fresh === '1');
    down.click();
    await new Promise(r => setTimeout(r, 900));
    check('down button goes to the bottom', window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2, [window.scrollY, document.documentElement.scrollHeight]);
    check('…and hides, dot cleared', down.hidden && !down.dataset.fresh);
    check('draft kept', inp.value === 'I am typing a long draft');
    // a small scroll up during a stream is not pulled back down
    const bottom = () => window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
    window.dispatchEvent(new WheelEvent('wheel', { deltaY: -20 }));
    window.scrollBy(0, -20); await tick();
    const y0 = window.scrollY;
    for (let i = 0; i < 3; i++) { ClaudeChat.receive([{ type: 'sdk', msg: { type: 'assistant', parent_tool_use_id: null, message: { id: 'm-s' + i, model: 'claude-opus-5-5', content: [{ type: 'text', text: 'Streamed line ' + i }] } } }]); await tick(); }
    check('20px up during a stream stays put', window.scrollY === y0 && !bottom(), [y0, window.scrollY]);
    check('…and the down button shows', !down.hidden && down.dataset.fresh === '1');
    window.scrollTo(0, document.documentElement.scrollHeight); await tick(); await new Promise(r => setTimeout(r, 320));
    window.dispatchEvent(new Event('scroll')); await tick();
    ClaudeChat.receive([{ type: 'sdk', msg: { type: 'assistant', parent_tool_use_id: null, message: { id: 'm-s9', model: 'claude-opus-5-5', content: [{ type: 'text', text: 'Back at the bottom' }] } } }]);
    // The follow scroll runs in an animation frame: wait for frames, not a fixed time.
    await Promise.race([new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))), new Promise(r => setTimeout(r, 500))]); await tick();
    check('back at the bottom, following again', bottom() && down.hidden, [bottom(), down.hidden, window.scrollY + innerHeight, document.documentElement.scrollHeight]);

    // 10 · file changes: Now first, Diff on request, Expand when it does not fit
    ClaudeChat.showUser('Raise the TTL');
    ClaudeChat.receive([
      { type: 'sdk', msg: { type: 'assistant', parent_tool_use_id: null, message: { id: 'm4', model: 'claude-opus-5-5', content: [{ type: 'tool_use', id: 'tu-e', name: 'Edit', input: CHANGE_SAMPLE.edit }] } } },
      { type: 'permission_request', id: 'p-e', toolName: 'Edit', input: CHANGE_SAMPLE.edit, toolUseID: 'tu-e', suggestions: [] }]);
    await tick();
    const card = [...document.querySelectorAll('.ck-card')].pop();
    const chg = card.querySelector('.ck-chg');
    check('card has the change view', !!chg);
    check('stats from the line diff', chg.querySelector('.ck-chg-stat').textContent === '+5−1', chg.querySelector('.ck-chg-stat').textContent);
    check('Now is the default', chg.querySelector('.ck-seg-b.is-on').dataset.m === 'now');
    check('Now shows no removed line, one fold', !chg.querySelector('.ck-ln.is-del') && chg.querySelectorAll('.ck-ln-gap.is-del').length === 1);
    check('Now shows the new version', chg.querySelector('.ck-chg-body').textContent.includes('10 * 60e3') && !chg.querySelector('.ck-chg-body').textContent.includes('5 * 60e3'));
    chg.querySelector('.ck-ln-gap.is-del').click();
    check('the fold opens the removed line', chg.querySelector('.ck-ln.is-del').textContent.includes('5 * 60e3'));
    chg.querySelector('.ck-seg-b[data-m="diff"]').click();
    check('Diff shows old and new', chg.querySelectorAll('.ck-ln.is-del').length === 1 && chg.querySelectorAll('.ck-ln.is-add').length === 5);
    check('Diff folds a long unchanged run', !!chg.querySelector('.ck-ln-gap.is-eq'));
    const exp = chg.querySelector('.ck-chg-exp');
    check('Expand shows for a change that does not fit', !exp.hidden);
    exp.click();
    check('Expand makes it big (and the card wide)', chg.classList.contains('is-big') && card.classList.contains('is-wide'));
    check('big body is taller', chg.querySelector('.ck-chg-body').clientHeight > 230, chg.querySelector('.ck-chg-body').clientHeight);
    exp.click();
    check('Collapse restores it', !chg.classList.contains('is-big') && !card.classList.contains('is-wide'));
    // the tool row has the same view (edits can run with no card)
    const rowLine = [...document.querySelectorAll('.ck-row')].pop();
    const rowDetail = rowLine.nextElementSibling;
    check('row detail holds the change view', rowDetail.classList.contains('is-change') && !!rowDetail.querySelector('.ck-chg'));
    ClaudeChat.receive([{ type: 'sdk', msg: { type: 'user', parent_tool_use_id: null, message: { role: 'user', content: [{ type: 'tool_result', tool_use_id: 'tu-e', content: 'The file has been updated.' }] } } }]);
    check('row meta from the line diff', rowLine.querySelector('.ck-meta').textContent === '+5 −1', rowLine.querySelector('.ck-meta').textContent);
    check('success keeps the view, no result text', !rowDetail.querySelector('.ck-out') && !!rowDetail.querySelector('.ck-chg'));
    rowLine.click(); await tick();
    check('row opens to the view', !rowDetail.hidden);
    // a failed edit shows the error above its change
    ClaudeChat.receive([
      { type: 'sdk', msg: { type: 'assistant', parent_tool_use_id: null, message: { id: 'm5', model: 'claude-opus-5-5', content: [{ type: 'tool_use', id: 'tu-w', name: 'Write', input: CHANGE_SAMPLE.write }] } } },
      { type: 'sdk', msg: { type: 'user', parent_tool_use_id: null, message: { role: 'user', content: [{ type: 'tool_result', tool_use_id: 'tu-w', is_error: true, content: 'Permission denied' }] } } }]);
    const wDetail = [...document.querySelectorAll('.ck-row')].pop().nextElementSibling;
    check('failed write: error first, then the change', wDetail.firstChild.classList.contains('ck-out') && wDetail.firstChild.textContent === 'Permission denied' && !!wDetail.querySelector('.ck-chg'));
    check('write view is numbered, no Now/Diff', !!wDetail.querySelector('.ck-ln-no') && !wDetail.querySelector('.ck-chg-seg'));

    // 11 · folder, branch and the ⋮ menu
    const ctx = $('.ck-ctx');
    check('status shows the folder before git answers', ctx.textContent === 'demo' && !ctx.querySelector('.ck-ctx-branch'), ctx.textContent);
    ClaudeChat.receive([{ type: 'git', repo: '/tmp/demo', branch: 'feature/cache', detached: false, upstream: 'origin/feature/cache', ahead: 2, behind: 1, changed: 3, staged: 1, untracked: 1, last: { sha: 'abc1234', subject: 'Cache the feed', when: '5 minutes ago' } }]);
    check('status shows folder + branch', ctx.textContent === 'demofeature/cache', ctx.textContent);
    check('dirty dot for changes', !!ctx.querySelector('.ck-ctx-dirty'));
    const gitAsks = posts.filter(p => p.type === 'git').length;
    $('.ck-more').click();
    check('⋮ opens the menu', popOpen() && $('.ck-pop').dataset.kind === 'more');
    check('opening asks git again', posts.filter(p => p.type === 'git').length === gitAsks + 1);
    const info = $('.ck-info').textContent;
    check('menu shows branch, changes, commit', info.includes('feature/cache') && info.includes('3 changed · 1 staged · 1 new · ↑2 · ↓1') && info.includes('abc1234 Cache the feed'), info);
    const pick = t => [...document.querySelectorAll('.ck-pop-item')].find(e => e.textContent === t).click();
    pick('Copy path');
    check('Copy path posts the cwd', lastPost('copy') && lastPost('copy').text === '/tmp/demo' && !popOpen(), lastPost('copy'));
    ctx.click(); pick('Reveal in Finder');
    check('the status item opens the same menu; Reveal posts', lastPost('reveal') && lastPost('reveal').path === '/tmp/demo');
    $('.ck-more').click(); pick('Open in TUI');
    check('Open in TUI', !!lastPost('openTUI'));
    const pickNew = () => [...document.querySelectorAll('.ck-pop-item')].find(e => e.textContent.startsWith('New…')).click();
    $('.ck-more').click();
    check('the "New…" options are one folded item', items().includes('New…') && !items().includes('New conversation') && !items().includes('New side chat'), items());
    pickNew();
    check('…which opens in place, the menu still open', popOpen() && items().includes('New side chat') && items().includes('New conversation')
      && $('.ck-pop-item.is-group').getAttribute('aria-expanded') === 'true' && document.querySelectorAll('.ck-pop-item.is-child').length === 2, items());
    pickNew();
    check('…and folds again', popOpen() && !items().includes('New conversation'));
    pickNew();
    pick('New conversation');
    check('New conversation sends /clear', lastPost('send').text === '/clear' && !popOpen());
    ClaudeChat.receive([{ type: 'git', repo: null }]);
    check('outside a repository: no branch', ctx.textContent === 'demo');
    $('.ck-more').click();
    check('menu says so', $('.ck-info').textContent.includes('not a git repository'));
    key('Escape', { target: document.body });
    check('Esc closes it', !popOpen());

    // 12 · side chats: forks of main, one full view at a time
    const view = $('.ck-view'), viewMore = $('.ck-view-more');
    const mainLog = $('#ck-log');
    check('switch offers a side chat', view.textContent.startsWith('Side chat') && viewMore.hidden, view.textContent);
    ClaudeChat.receive([{ type: 'mode', mode: 'plan' }]);   // main runs in Plan; a side chat still starts on Ask
    inp.value = 'main draft';
    view.click();
    const open1 = lastPost('openSide');
    check('opens a fork with main\'s model', open1 && open1.channel === 'side-1' && open1.model === 'sonnet', open1);
    const sideLog = document.querySelector('.ck-log.is-side');
    check('full view switches to the side', document.body.classList.contains('is-side') && mainLog.hidden && !sideLog.hidden);
    check('side header says it is a fork', sideLog.querySelector('.ck-side-head').textContent.includes('A fork of main'));
    check('side starts on Ask (manual)', $('.ck-mode').dataset.mode === 'default', $('.ck-mode').dataset.mode);
    check('switch now leads back to Main', view.textContent.startsWith('Main') && !viewMore.hidden);
    check('each view keeps its draft', inp.value === '');
    type('what does makeCache return?'); key('Enter');
    check('side sends on its own channel', lastPost('send').channel === 'side-1' && lastPost('send').text === 'what does makeCache return?');
    check('the turn is drawn in the side log', sideLog.querySelector('.ck-user-text').textContent === 'what does makeCache return?' && ![...mainLog.querySelectorAll('.ck-user-text')].some(e => e.textContent.startsWith('what does makeCache')));
    ClaudeChat.receive([{ type: 'sdk', msg: { type: 'system', subtype: 'init', session_id: 'fork-1', model: 'claude-sonnet-5', permissionMode: 'default', cwd: '/tmp/demo' } }], 'side-1');
    type('side draft');
    view.click();
    check('back in main: its draft and its mode', !document.body.classList.contains('is-side') && inp.value === 'main draft' && $('.ck-mode').dataset.mode === 'plan');
    ClaudeChat.receive([{ type: 'sdk', msg: { type: 'assistant', parent_tool_use_id: null, message: { id: 'side-m1', model: 'claude-sonnet-5', content: [{ type: 'text', text: 'It returns get, set and size.' }] } } },
      { type: 'sdk', msg: { type: 'result', subtype: 'success', duration_ms: 900, num_turns: 1, total_cost_usd: 0.004 } }], 'side-1');
    check('side output lands in the side log only', sideLog.textContent.includes('It returns get, set and size.') && !mainLog.textContent.includes('It returns get, set'));
    check('switch shows news from the side', view.dataset.attn === 'unseen', view.dataset.attn);
    ClaudeChat.receive([{ type: 'permission_request', id: 'p-side', toolName: 'Bash', input: { command: 'ls' }, toolUseID: 'tu-side', suggestions: [] }], 'side-1');
    check('…and a side approval as waiting', view.dataset.attn === 'waiting');
    check('the tab dot hears about it', lastPost('state').waiting === true);
    key('1', { target: document.body });
    check('main\'s keys do not answer the side card', !posts.some(p => p.type === 'permission' && p.id === 'p-side'));
    view.click();
    check('side draft restored', inp.value === 'side draft' && !sideLog.hidden);
    inp.value = ''; key('1', { target: document.body });
    check('in view, 1 answers the side card on its channel', posts.some(p => p.type === 'permission' && p.id === 'p-side' && p.channel === 'side-1'));
    // a second side chat from the menu, then close one
    viewMore.click();
    check('menu lists the conversations', items().join('|').includes('Main') && items().join('|').includes('Side 1') && items().join('|').includes('New side chat'), items());
    [...document.querySelectorAll('.ck-pop-item')].find(e => e.textContent.startsWith('New side chat')).click();
    check('a second side chat', lastPost('openSide').channel === 'side-2' && document.querySelectorAll('.ck-log.is-side').length === 2);
    $('.ck-more').click();
    [...document.querySelectorAll('.ck-pop-item')].find(e => e.textContent === 'Close this side chat').click();
    check('closing it tells the host and goes back to main', lastPost('closeSide').channel === 'side-2' && !document.body.classList.contains('is-side') && document.querySelectorAll('.ck-log.is-side').length === 1);
    check('switch leads to the remaining side', view.textContent.startsWith('Side 1'), view.textContent);

    // (the auto-grow the grip builds on)
    type('line 1\nline 2\nline 3\nline 4'); await tick();
    check('a long prompt grows the composer', inp.offsetHeight > 60, inp.offsetHeight);
    type('');

    // 13 · composer height: the grip on the left
    const grip = $('.ck-grip');
    const h0 = inp.offsetHeight;
    grip.dispatchEvent(new PointerEvent('pointerdown', { clientY: 380, bubbles: true }));
    document.dispatchEvent(new PointerEvent('pointermove', { clientY: 300, bubbles: true }));
    document.dispatchEvent(new PointerEvent('pointerup', { clientY: 300, bubbles: true }));
    check('dragging up makes the composer taller', inp.offsetHeight >= h0 + 70, [h0, inp.offsetHeight]);

    check('…then the conversation: the session restarts at the entry before the prompt', rs && rs.resumeAt === 'a-1' && rs.dropsTurn === u2, rs);
    check('…the prompt and its reply are gone', !t2.isConnected && mainLog.querySelectorAll('.ck-turn').length === rwTurns - 1 && !mainLog.textContent.includes('Two.'));
    check('…its text is back in the composer', inp.value === 'Second prompt' && rwPanel.hidden, inp.value);
    check('…and a short notice says so', mnotes().pop().textContent === 'Rewound · 1 file put back');
    // Esc Esc: the picker; "Conversation only" when no file changed
    type('');
    key('Escape'); key('Escape');
    check('Esc Esc opens the list of prompts', popOpen() && $('.ck-pop').dataset.kind === 'rewind' && items()[0] === 'First prompt', items().slice(0, 3));
    key('Enter');
    const dry1 = lastPost('rewindFiles');
    ClaudeChat.receive([{ type: 'rewind', id: dry1.id, uuid: u1, dryRun: true, canRewind: true, filesChanged: [] }]);
    check('no file changes: says so, code choices stay off', rwPanel.querySelector('.ck-rw-files').textContent === 'No file changes since this prompt.' && rwPanel.querySelector('[data-mode="code"]').disabled);
    const posts0 = posts.length;
    key('Enter');
    await wait(0);
    check('Return: conversation only (no files request)', lastPost('restartAt').dropsTurn === u1 && !posts.slice(posts0).some(p => p.type === 'rewindFiles') && inp.value === 'First prompt', inp.value);
    // code only: the conversation stays
    type('Third prompt'); key('Enter');
    const u3 = lastPost('send').uuid, t3 = lastTurn();
    ClaudeChat.receive([said('a-3', 'Three.')]); settle();
    t3.querySelector('.ck-rewind-btn').click();
    ClaudeChat.receive([{ type: 'rewind', id: lastPost('rewindFiles').id, uuid: u3, dryRun: true, canRewind: true, filesChanged: ['/tmp/demo/b.js', '/tmp/demo/c.js'], insertions: 9, deletions: 2 }]);
    const restarts = posts.filter(p => p.type === 'restartAt').length;
    type(''); key('3');
    ClaudeChat.receive([{ type: 'rewind', id: lastPost('rewindFiles').id, uuid: u3, dryRun: false, canRewind: true }]);
    await wait(0);
    check('3: code only — the files go back, the conversation stays', t3.isConnected && posts.filter(p => p.type === 'restartAt').length === restarts && mnotes().pop().textContent.startsWith('Files put back as they were before “Third prompt” · 2 files'), mnotes().pop().textContent);
    // no checkpoint: only the conversation can go back
    t3.querySelector('.ck-rewind-btn').click();
    ClaudeChat.receive([{ type: 'rewind', id: lastPost('rewindFiles').id, uuid: u3, dryRun: true, canRewind: false, error: 'No file checkpoint found for this message' }]);
    check('no checkpoint: says why; code choices off', rwPanel.querySelector('.ck-rw-files').textContent === 'The files cannot be put back: No file checkpoint found for this message.' && rwPanel.querySelector('[data-mode="both"]').disabled);
    const before1 = posts.length;
    type(''); key('1');
    check('…a disabled choice does nothing', posts.length === before1 && !rwPanel.hidden);
    key('Escape');
    check('Esc closes the panel', rwPanel.hidden && t3.isConnected);
    // while it works: not now
    type('Busy prompt'); key('Enter');
    lastTurn().querySelector('.ck-rewind-btn').click();
    check('while a turn runs: not now', rwPanel.hidden && mnotes().pop().textContent.startsWith('Stop the current turn'));
    settle();
    // after the cut to before "First prompt", the next prompt's rewind resumes where that one did
    t3.querySelector('.ck-rewind-btn').click();
    ClaudeChat.receive([{ type: 'rewind', id: lastPost('rewindFiles').id, uuid: u3, dryRun: true, canRewind: true, filesChanged: [] }]);
    type(''); key('2'); await wait(0);
    check('a prompt sent after a cut resumes from the cut point', lastPost('restartAt').resumeAt === 'a-0' && lastPost('restartAt').dropsTurn === u3, lastPost('restartAt'));
    type('Busy prompt'); key('Enter');
    // a cut Claude Code refuses: go on from the whole session
    ClaudeChat.receive([sdkl({ type: 'result', subtype: 'error_during_execution', is_error: true, errors: ['Resume rejected by --resume-drops-turn: a queued message is in the dropped range'] })]);
    check('a refused cut: restart plainly, and say so', lastPost('restartAt').plain === true && mnotes().pop().textContent.startsWith('Claude Code could not cut'));

    // 31e · /btw: a side question in a panel; follow-ups carry the thread; nothing goes into the conversation
    const btwP = $('.ck-btw'), bfield = () => btwP.querySelector('.ck-btw-field');
    type('/bt');
    check('/btw is offered', items()[0] && items()[0].startsWith('/btw'), items().slice(0, 2));
    key('Escape');
    const turnsB = mainLog.querySelectorAll('.ck-turn').length, sendsB = sendCount();
    type('/btw what is the cat called?'); key('Enter');
    const q1 = lastPost('btw');
    check('/btw <question> asks it as a side question', q1 && q1.question === 'what is the cat called?' && Array.isArray(q1.history) && q1.history.length === 0 && q1.channel === 'main', q1);
    check('…not as a message: no turn, nothing sent', mainLog.querySelectorAll('.ck-turn').length === turnsB && sendCount() === sendsB && inp.value === '');
    check('the panel shows the question and waits', !btwP.hidden && btwP.querySelector('.ck-btw-q').textContent === 'what is the cat called?' && btwP.querySelector('.ck-btw-a').classList.contains('is-wait'));
    check('…its field takes the follow-up', document.activeElement === bfield());
    ClaudeChat.receive([{ type: 'btw', id: q1.id, response: 'Your cat is called **Miso**.', synthetic: false }]);
    check('the answer, as Markdown', btwP.querySelector('.ck-btw-a strong') && btwP.querySelector('.ck-btw-a').textContent.trim() === 'Your cat is called Miso.', btwP.querySelector('.ck-btw-a').textContent);
    bfield().value = 'and its colour?';
    bfield().dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    const q2 = lastPost('btw');
    check('a follow-up sends the thread as history', q2.question === 'and its colour?' && q2.history.length === 1 && q2.history[0].question === 'what is the cat called?' && q2.history[0].response === 'Your cat is called **Miso**.', q2.history);
    bfield().value = 'too soon';
    bfield().dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    check('…one at a time: no new question while one waits', lastPost('btw') === q2 && bfield().value === 'too soon');
    ClaudeChat.receive([{ type: 'btw', id: 'stale', response: 'old answer' }]);
    check('an answer to another question is ignored', !btwP.textContent.includes('old answer'));
    ClaudeChat.receive([{ type: 'btw', id: q2.id, error: 'the session is not running here' }]);
    check('an error says so, in the thread', btwP.querySelectorAll('.ck-btw-a')[1].classList.contains('is-error') && btwP.querySelectorAll('.ck-btw-a')[1].textContent.startsWith('No answer: the session is not running'));
    bfield().value = 'third';
    bfield().dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    check('…and the failed one stays out of the history', lastPost('btw').history.length === 1);
    ClaudeChat.receive([{ type: 'btw', id: lastPost('btw').id, response: 'Three.' }]);
    check('the conversation stays as it was', mainLog.querySelectorAll('.ck-turn').length === turnsB && !mainLog.textContent.includes('Miso'));
    bfield().dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
    check('Esc closes the panel and drops the thread', btwP.hidden && !btwP.querySelector('.ck-btw-q') && document.activeElement === inp);
    type('/btw'); key('Enter');
    check('Return on "/btw" completes it first (it takes a question)', inp.value === '/btw ' && btwP.hidden, inp.value);
    key('Enter');
    check('/btw alone: an empty panel, ready for a question', !btwP.hidden && !btwP.querySelector('.ck-btw-q') && document.activeElement === bfield());
    bfield().value = 'new thread';
    bfield().dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    check('…a new thread starts with no history', lastPost('btw').history.length === 0);
    btwP.querySelector('.ck-sub-x').click();
    check('× closes it', btwP.hidden);
    type('Busy turn'); key('Enter');
    const stops0 = posts.filter(p => p.type === 'interrupt').length;
    type('/btw while you work?'); key('Enter');
    check('it works while a turn runs', lastPost('btw').question === 'while you work?' && !btwP.hidden);
    inp.focus(); key('Escape');
    check('Esc in the composer closes it first (does not stop the turn)', btwP.hidden && posts.filter(p => p.type === 'interrupt').length === stops0);
    settle();

    // 31f · a prompt's fate: "Queued" while it waits, "Not sent" if it never ran; vcs and live phrase signals
    const life = (id, state) => sdkl({ type: 'command_lifecycle', command_uuid: id, state, uuid: 'x', session_id: 's' });
    const badge = t => t.querySelector('.ck-user-state');
    type('Long job'); key('Enter');
    const uA = lastPost('send').uuid, tA = lastTurn();
    ClaudeChat.receive([life(uA, 'queued'), life(uA, 'started')]);
    await wait(700);
    check('a quick queued → started shows no badge', !badge(tA));
    type('And then this'); key('Enter');
    const uB = lastPost('send').uuid, tB = lastTurn();
    ClaudeChat.receive([life(uB, 'queued')]);
    check('…not at once (it may start in a moment)', !badge(tB));
    await wait(700);
    check('a message that waits says "Queued"', badge(tB) && badge(tB).textContent === 'Queued' && badge(tB).disabled, badge(tB) && badge(tB).textContent);
    ClaudeChat.receive([life(uB, 'started')]);
    check('…and the badge goes when it starts', !badge(tB));
    type('One more'); key('Enter');
    const uC = lastPost('send').uuid, tC = lastTurn();
    ClaudeChat.receive([life(uC, 'queued'), life(uC, 'cancelled'), life(uA, 'completed'), life(uB, 'cancelled')]);
    check('cancelled before it ran: "Not sent"', badge(tC) && badge(tC).textContent === 'Not sent' && !badge(tC).disabled);
    check('cancelled after it started: no badge (the turn says "Stopped")', !badge(tB) && !badge(tA));
    settle();
    type('');
    badge(tC).click();
    check('a click on "Not sent" puts the text back', inp.value === 'One more', inp.value);
    type('Odd one'); key('Enter');
    const uD = lastPost('send').uuid, tD = lastTurn();
    ClaudeChat.receive([life(uD, 'refused')]);
    check('refused: says so', badge(tD) && badge(tD).textContent === 'Refused');
    ClaudeChat.receive([sdkl({ type: 'system', subtype: 'task_summary', detail: 'Running the test suite' })]);
    check('the live phrase shows in the status line', $('.ck-status-text').textContent === 'Running the test suite', $('.ck-status-text').textContent);
    settle();
    check('…and goes when the turn ends', $('.ck-status-text').textContent.startsWith('Ready'), $('.ck-status-text').textContent);
    const gits = posts.filter(p => p.type === 'git').length;
    ClaudeChat.receive([sdkl({ type: 'system', subtype: 'vcs_state_changed', kind: 'commit', branch: 'main' })]);
    check('a commit or push re-reads git (the branch chip)', posts.filter(p => p.type === 'git').length === gits + 1);

    // 31 · motion: new words fade in, new things rise in, folds slide, menus open softly
    window.setTimeout = realTimeout;
    document.documentElement.classList.remove('no-motion');
    const anims = el => el && el.getAnimations ? el.getAnimations().length : 0;
    const frames = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const se = ev => sdkl({ type: 'stream_event', event: ev });
    type('Say something'); key('Enter');
    ClaudeChat.receive([se({ type: 'message_start', message: { id: 'm-rv' } }), se({ type: 'content_block_start', index: 0, content_block: { type: 'text', text: '' } }),
      se({ type: 'content_block_delta', index: 0, delta: { type: 'text_delta', text: 'First words arrive. ' } })]);
    await frames();
    const rvText = () => [...mainLog.querySelectorAll('.ck-text')].pop();
    const fresh = () => [...rvText().querySelectorAll('.sk-fresh')];
    check('new words fade in', fresh().length > 0 && fresh().map(f => f.textContent).join('') === 'First words arrive. ', fresh().map(f => f.textContent));
    await wait(60);
    ClaudeChat.receive([se({ type: 'content_block_delta', index: 0, delta: { type: 'text_delta', text: 'Then more.' } })]);
    await frames();
    const frs = fresh();
    check('…the earlier words keep fading (their fade is under way), the new ones start',
      frs.length === 2 && frs[0].textContent === 'First words arrive. ' && parseInt(frs[0].style.animationDelay) <= -50 && frs[1].textContent === 'Then more.' && parseInt(frs[1].style.animationDelay) > -40,
      frs.map(f => [f.textContent, f.style.animationDelay]));
    await wait(320);
    ClaudeChat.receive([se({ type: 'content_block_delta', index: 0, delta: { type: 'text_delta', text: '\n\nA new paragraph.' } })]);
    await frames();
    check('…a finished fade is not wrapped again', fresh().every(f => !f.textContent.includes('First words')) && fresh().some(f => f.textContent === 'A new paragraph.'), fresh().map(f => f.textContent));
    ClaudeChat.receive([se({ type: 'content_block_stop', index: 0 }), ...toolLines('tu-mo1', 'Bash', { command: 'ls' }), ...toolLines('tu-mo2', 'Bash', { command: 'pwd' })]);
    const moRow = mrows().pop();
    check('a new tool row rises in', anims(moRow) > 0);
    ClaudeChat.receive([sdkl({ type: 'user', parent_tool_use_id: null, message: { role: 'user', content: [{ type: 'tool_result', tool_use_id: 'tu-mo2', content: '/tmp/demo' }] } })]);
    await wait(250);
    const moDetail = moRow.nextElementSibling;
    const moPill = moRow.closest('.ck-tray').querySelector('.ck-tray-pill');
    moPill.click();   // the rows are in the turn's tray: open it to see them
    moRow.click();
    check('a row opens with a slide', !moDetail.hidden && anims(moDetail) > 0);
    await wait(250);
    moRow.click();
    check('…and closes: hidden at once, drawn until the slide ends', moDetail.hidden && moDetail.style.display !== '' && anims(moDetail) > 0);
    await wait(260);
    check('…then gone', moDetail.style.display === '' && getComputedStyle(moDetail).display === 'none');
    moRow.click(); moRow.click();
    check('a quick second click takes over the slide', moDetail.hidden && anims(moDetail) === 1);
    await wait(260);
    moPill.click();
    $('.ck-model').click();
    check('a menu opens softly', popOpen() && anims($('.ck-pop')) > 0);
    key('Escape');
    settle();
    document.documentElement.classList.add('no-motion');
    ClaudeChat.receive([...toolLines('tu-mo3', 'Bash', { command: 'date' })]);
    check('no-motion: nothing moves', anims(mrows().pop()) === 0 && anims(mrows().pop().closest('.ck-run')) === 0);
    settle();

    console.error(`dock-test: ${pass} passed`);
    window.__pending = false;
  } catch (e) { console.error('dock-test threw: ' + e.message + ' ' + (e.stack || '').split('\n')[0]); window.__pending = false; } })();
</script>
</body></html>
