<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>pi tab check</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../skim.css">
<link rel="stylesheet" href="../chat.css">
<script src="../vendor/marked.min.js"></script>
<script src="../vendor/purify.min.js"></script>
<script src="../vendor/highlight.min.js"></script>
<script src="../skim-classify.js"></script>
<script src="../skim-render.js"></script>
<script src="../agent-events.js"></script>
<script src="../agent-claude.js"></script>
<script src="../agent-codex.js"></script>
<script src="../agent-pi.js"></script>
<script src="../chat.js"></script>
</head><body>
<script>
  // The pi tab, drawn from the exact stream the bridge forwards: the page's pi
  // adapter normalizes it, and nothing here is pi-specific drawing.
  //   swift Resources/SkimRender/dev/snapshot.swift Resources/SkimRender/dev/pi-check.html /tmp/pi.png 760 2 640
  window.__pending = true;
  document.documentElement.classList.add('no-motion');
  const posts = [];
  window.webkit = { messageHandlers: { skim: { postMessage: m => { if (m.type === 'action') posts.push(m.action); return Promise.resolve(); } } } };
  const q = new URLSearchParams(location.search);
  AgentChat.boot({ agent: 'pi', cwd: '/Users/demo/project', home: '/Users/demo' });
  // pi's own events, forwarded thin by the bridge.
  const native = event => ({ v: 1, agent: 'pi', t: Date.now(), type: 'native', event });
  const ev = (type, f = {}) => ({ v: 1, agent: 'pi', t: Date.now(), type, ...f });
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const frame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 10)));
  let pass = 0, fail = 0;
  window.__errors = window.__errors || [];
  const check = (name, ok, got) => { if (ok) pass++; else { fail++; window.__errors.push('FAIL ' + name + (got !== undefined ? ' got: ' + JSON.stringify(got) : '')); } };
  const stage = name => window.__errors.push('· at ' + name);
  const text = () => $('.ck-log').textContent;
  const inp = () => $('.ck-input');
  const type = v => { const i = inp(); i.focus(); i.value = v; i.dispatchEvent(new Event('input', { bubbles: true })); };
  const enter = () => inp().dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
  (async () => { try {
    stage('start');
    AgentChat.receive([
      ev('capabilities', { features: { history: true, models: true, effort: true, thinking: true, usage: true, slashCommands: true, midTurnInput: true, images: true, shell: true, git: true },
        commands: [{ name: 'compact', description: 'Compact this conversation', argumentHint: '' }],
        models: [{ value: 'fake/model-a', displayName: 'Fake Model A', description: 'fake · reasoning', supportsEffort: true, supportedEffortLevels: ['off','low','medium','high'] },
                 { value: 'fake/model-b', displayName: 'Fake Model B', description: 'fake', supportsEffort: true, supportedEffortLevels: ['off','low','medium','high'] }],
        mode: 'one-at-a-time' }),
      ev('session', { sessionId: 'pi-1', model: 'fake/model-a', cwd: '/Users/demo/project' }),
      ev('model', { model: 'fake/model-a' }),
      ev('effort', { effort: 'medium' }),
      ev('usage', { modelUsage: { 'fake/model-a': { inputTokens: 120, outputTokens: 30, cacheReadInputTokens: 10, cacheCreationInputTokens: 0, costUSD: 0.012 } }, context: { totalTokens: 160, maxTokens: 1000, percentage: 16, model: 'fake/model-a' } })
    ]);
    stage('after caps');
    await frame();
    check('the tab wears the pi model', $('.ck-model').textContent.includes('Fake Model A'), $('.ck-model').textContent);
    // pi has no approval gate; the page must not offer one.
    check('no approval-mode chip for pi', !$('.ck-mode'));

    stage('after hello check');
    type('what is in this folder?'); enter();
    stage('after type');
    check('the message posts as a send for pi', posts.some(p => p.type === 'send' && /what is in this folder/.test(p.text)), posts.filter(p => p.type === 'send'));

    AgentChat.receive([
      native({ type: 'agent_start' }), native({ type: 'turn_start' }),
      native({ type: 'message_start', message: { role: 'assistant', id: 'm1', content: [] } }),
      native({ type: 'message_update', usage: {}, assistantMessageEvent: { type: 'thinking_start', contentIndex: 0 } }),
      native({ type: 'message_update', usage: {}, assistantMessageEvent: { type: 'thinking_delta', contentIndex: 0, delta: 'list the directory first' } }),
      native({ type: 'message_update', usage: {}, assistantMessageEvent: { type: 'thinking_end', contentIndex: 0, content: 'list the directory first' } }),
      native({ type: 'message_update', usage: {}, assistantMessageEvent: { type: 'text_start', contentIndex: 1 } }),
      native({ type: 'message_update', usage: {}, assistantMessageEvent: { type: 'text_delta', contentIndex: 1, delta: 'Two files' } }),
      native({ type: 'message_update', usage: {}, assistantMessageEvent: { type: 'text_delta', contentIndex: 1, delta: ', then I will read them.' } }),
      native({ type: 'message_update', usage: {}, assistantMessageEvent: { type: 'toolcall_start', contentIndex: 2, id: 'call_1', toolName: 'bash' } }),
      native({ type: 'message_update', usage: {}, assistantMessageEvent: { type: 'toolcall_end', contentIndex: 2, toolCall: { id: 'call_1', name: 'bash', arguments: { command: 'ls -la' } } } }),
      native({ type: 'message_end', message: { role: 'assistant', id: 'm1', content: [{ type: 'thinking', thinking: 'list the directory first' }, { type: 'text', text: 'Two files, then I will read them.' }, { type: 'toolCall', id: 'call_1', name: 'bash', arguments: { command: 'ls -la' } }], usage: { input: 120, output: 30, cacheRead: 10, cacheWrite: 0, totalTokens: 160, cost: { total: 0.012 } } } }),
      native({ type: 'tool_execution_start', toolCallId: 'call_1', toolName: 'bash', args: { command: 'ls -la' } }),
      native({ type: 'tool_execution_update', toolCallId: 'call_1', toolName: 'bash', partialResult: { content: [{ type: 'text', text: 'README.md\n' }] } }),
      native({ type: 'tool_execution_end', toolCallId: 'call_1', toolName: 'bash', result: { content: [{ type: 'text', text: 'README.md\nsidecar.mjs\n' }] }, isError: false }),
      native({ type: 'turn_end', message: { role: 'assistant', id: 'm1', usage: { input: 120, output: 30, totalTokens: 160, cost: { total: 0.012 } } }, toolResults: [{ toolCallId: 'call_1', toolName: 'bash', content: [{ type: 'text', text: 'README.md\nsidecar.mjs\n' }] }] } }),
      native({ type: 'agent_end', messages: [] }), native({ type: 'agent_settled' })
    ]);
    stage('after turn receive');
    await frame();
    check('the assistant text is drawn once, complete', (text().match(/Two files, then I will read them\./g) || []).length === 1, text().match(/Two files[^T]*/)?.[0]);
    check('thinking is kept, not merged into the reply', text().includes('list the directory first'));
    check('the tool card names pi\'s tool', !!$('.ck-row .ck-tool'), $$('.ck-row').map(r => r.className));
    check('the tool card shows the command', text().includes('ls -la'));
    check('the tool card shows its result', text().includes('sidecar.mjs'));
    check('the turn settles, not spinning', !document.querySelector('.ck-typing'));
    check('a progress update does not duplicate the result',
      (text().match(/README\.md/g) || []).length <= 2, (text().match(/README\.md/g) || []).length);
    check('cost and tokens are painted', text().includes('160') || $('.ck-meta').textContent.includes('160'), $('.ck-meta').textContent);

    // A pi extension dialog arrives as an approval card with pi's own choices.
    stage('before approval');
    AgentChat.receive([ev('approval.request', { request: { id: 'ui-7', kind: 'permission', toolName: 'Allow dangerous command?', input: {}, availableDecisions: ['Allow', 'Block'], decisionReason: null } })]);
    await frame();
    const card = $('.ck-native-card');
    check('the dialog is a card', !!card, !!card);
    check('the card title is pi\'s question', card && card.textContent.includes('Allow dangerous command?'), card && card.textContent);
    const labels = card ? [...card.querySelectorAll('.ck-opt')].map(b => b.textContent) : [];
    check('pi\'s own decisions are the buttons', labels.join('|') === 'Allow|Block', labels);
    card.querySelectorAll('.ck-opt')[1].click();
    const answer = posts.filter(p => p.type === 'permission').pop();
    check('the answer echoes pi\'s option', answer && answer.decision === 'deny' && answer.response.decision === 'Block', answer);

    // A host `!` command: the bridge reports it, the page draws a shell card.
    stage('before shell');
    type('!pwd'); enter();
    await frame();
    const run = posts.filter(p => p.type === 'shell').pop();
    check('the shell command is announced', run && run.command === 'pwd', run);
    AgentChat.receive([ev('shell', { id: run.id, stream: 'stdout', chunk: '/Users/demo/project\n' }), ev('shell', { id: run.id, done: true, code: 0 })]);
    await frame();
    check('the shell output is drawn', text().includes('/Users/demo/project'), text().slice(-200));

    // The model picker lists what pi reported.
    stage('before model pop');
    $('.ck-model').click();
    await frame();
    const items = $$('.ck-pop .ck-model-item, .ck-pop [data-model]').map(el => el.textContent);
    check('the model list has pi\'s models', items.some(t => /Fake Model A/.test(t)) && items.some(t => /Fake Model B/.test(t)), items);
    if (q.get('pop')) return;
    $('.ck-model').click();

    window.__testResults = { passed: pass, failed: fail };
    window.__pending = false;
  } catch (error) { window.__errors.push('FAIL threw: ' + error.message + ' ' + (error.stack || '').split('\n')[1]); window.__testResults = { passed: pass, failed: fail + 1 }; window.__pending = false; } })();
</script></body></html>
