<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; margin: 16px; width: 320px; color: #222; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p { color: #666; margin: 6px 0; }
    .status { font-weight: 600; padding: 6px 8px; border-radius: 6px; margin: 8px 0; }
    .up { background: #e6f4ea; color: #137333; }
    .down { background: #fce8e6; color: #c5221f; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin: 4px 0 8px; }
    button { padding: 6px 12px; }
    code { background: #f1f3f4; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>FloatyTerm CDP Bridge</h1>
  <div id="status" class="status down">checking…</div>
  <p>Connects your live Chrome tabs to FloatyTerm over CDP. Drive them with
     <code>floaty eval --via-extension …</code>.</p>
  <p>Optional shared token (only if you created
     <code>cdp-bridge-token.txt</code> in FloatyTerm's support folder):</p>
  <input id="token" type="text" placeholder="shared token (leave blank if unused)">
  <button id="save">Save</button>
  <button id="reconnect">Reconnect</button>
  <script src="options.js"></script>
</body>
</html>
